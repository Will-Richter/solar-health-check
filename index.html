<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ground-level solar self-check for homeowners and on-site health check reports for technicians.">
<meta name="theme-color" content="#12294D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solar Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Solar Health Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Layout: one phone-width column of instrument-panel cards under a sticky header with a
   two-way mode switch. Readings are set like a nameplate: condensed caps labels, mono values. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --sunk:#E2E8F0; --ink:#0D1A2B; --muted:#55657A; --line:#D0D9E4;
  --accent:#1746C8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFC;
  --sun:#F2A900;
  --good:#146F38; --good-soft:#DCF2E3; --warn:#8F5400; --warn-soft:#FBEDCF; --bad:#B3261E; --bad-soft:#FBE2DF;
  --glass:#12294D; --glass-line:#2F4D80; --glass-ink:#F2F6FC; --glass-muted:#A9BBD6;
  --shadow:0 1px 2px rgba(13,26,43,.06), 0 6px 18px rgba(13,26,43,.05);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09111C; --surface:#121C2A; --sunk:#0D1622; --ink:#E7EDF5; --muted:#93A3B8; --line:#243347;
    --accent:#7AA2FF; --accent-ink:#07122A; --accent-soft:#182847;
    --sun:#FFC043;
    --good:#5ED391; --good-soft:#11301F; --warn:#F3BA55; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1917;
    --glass:#0E2140; --glass-line:#27416E; --glass-ink:#F2F6FC; --glass-muted:#9FB2CF;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09111C; --surface:#121C2A; --sunk:#0D1622; --ink:#E7EDF5; --muted:#93A3B8; --line:#243347;
  --accent:#7AA2FF; --accent-ink:#07122A; --accent-soft:#182847;
  --sun:#FFC043;
  --good:#5ED391; --good-soft:#11301F; --warn:#F3BA55; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1917;
  --glass:#0E2140; --glass-line:#27416E; --glass-ink:#F2F6FC; --glass-muted:#9FB2CF;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:600px;margin-inline:auto;padding-inline:16px;padding-block:0 40px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background-color:var(--glass);
  background-image:linear-gradient(var(--glass-line) 1px,transparent 1px),linear-gradient(90deg,var(--glass-line) 1px,transparent 1px);
  background-size:11px 11px;background-position:-1px -1px;position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--sun)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,4.7vw,22px);letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;padding:0 12px;font-weight:500;font-size:14px;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.modes button{border:0;background:transparent;border-radius:7px;padding:8px 6px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}
.between{justify-content:space-between}

/* type */
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;letter-spacing:.02em;text-wrap:balance}
h3{font-weight:600;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.data{font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background-color:var(--glass);color:var(--glass-ink);border-radius:var(--r);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
  background-image:linear-gradient(var(--glass-line) 1px,transparent 1px),linear-gradient(90deg,var(--glass-line) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
.hero::before{content:"";position:absolute;right:-46px;top:-46px;width:130px;height:130px;border-radius:50%;background:var(--sun);opacity:.95}
.hero > *{position:relative}
.hero .eyebrow{color:var(--glass-muted);max-width:calc(100% - 84px)}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em;max-width:calc(100% - 70px)}
.hero .sub{color:var(--glass-muted);font-size:15px}
.hero .btn.primary{background:var(--sun);color:#1B1300}
.hero .btn.ghost{border-color:var(--glass-line);color:var(--glass-ink);background:rgba(255,255,255,.06)}

.banner{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--muted);background:var(--sunk);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner strong{color:var(--ink);font-weight:600}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:46px;padding:10px 16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-weight:600;font-size:13px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.attention{background:var(--warn-soft);color:var(--warn)}
.pill.urgent{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--sunk);color:var(--muted)}
.pill.wrap{white-space:normal;border-radius:8px;align-items:flex-start;padding:5px 10px 5px 8px}
.pill.wrap::before{flex:none;margin-top:5px}
.verdict{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.verdict.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.verdict.attention{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.verdict.urgent{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.verdict h1{color:inherit}
.verdict p{color:var(--ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span, .label{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;min-height:46px}
textarea{min-height:88px;resize:vertical}
input.num{font-family:var(--font-data)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.unit{position:relative}
.unit input{padding-right:46px}
.grid3 input{padding-left:9px}
.grid3 .unit input{padding-right:24px}
.grid3 .unit i{right:8px}
.unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--font-data);font-size:13px;color:var(--muted);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.c-ok[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.c-issue[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.c-warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.c-na[aria-pressed="true"]{background:var(--sunk);border-color:var(--muted);color:var(--ink)}

.q{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q:last-child{padding-bottom:0}
.q p.small{color:var(--muted)}

/* progress + tabs */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-bottom:3px solid transparent;background:none;padding:8px 10px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* readouts */
.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.readouts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.readout{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.readout b{font-family:var(--font-data);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.readout span{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.readout em{font-style:normal;font-size:12px;color:var(--muted)}
.meter{height:12px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.meter.ok > i{background:var(--good)} .meter.attention > i{background:var(--warn)} .meter.urgent > i{background:var(--bad)}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-data);font-size:11px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.chev{color:var(--muted);font-family:var(--font-data)}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.plain li{display:flex;gap:10px;align-items:flex-start}
ul.plain li > i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--muted)}
ul.plain li.urgent > i{background:var(--bad)} ul.plain li.attention > i{background:var(--warn)} ul.plain li.ok > i{background:var(--good)}
.safety{border-left:4px solid var(--sun);background:var(--sunk);border-radius:6px;padding:12px 14px;font-size:15px}
.phone{font-family:var(--font-data);font-weight:600;font-size:22px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(9,17,28,.75);color:#fff;font-size:15px;line-height:1}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(9,17,28,.7);color:#fff;font-size:11px;padding:2px 6px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-display);font-weight:600}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;background:var(--surface);text-align:center;padding:6px}
.addph b{font-size:24px;line-height:1;font-weight:500}
.addph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* chart */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-data);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.last{fill:var(--sun)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .val{fill:var(--ink);font-weight:600}
.tip{font-size:14px;color:var(--muted);min-height:21px}
.tip b{color:var(--ink);font-family:var(--font-data)}

/* string cards */
.string{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th{font-family:var(--font-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.rep td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.rep td.n, table.rep th.n{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}

.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-top:6px}
.sticky-actions{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);padding:10px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.sticky-actions .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.meter > i{transition:width .3s ease}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><div class="mark" aria-hidden="true"></div><div class="brand-name">Solar Health Check</div></div>
      <button class="icon-btn" id="btn-settings" data-act="go" data-view="settings">Settings</button>
    </div>
    <nav class="modes" aria-label="Mode">
      <button id="mode-home" data-act="mode" data-mode="home" aria-pressed="true">My system</button>
      <button id="mode-tech" data-act="mode" data-mode="tech" aria-pressed="false">Technician</button>
    </nav>
  </header>
  <main id="view"><div class="card"><p class="muted">Loading your saved checks…</p></div></main>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
/* Installer details shown to everyone who opens the app. Edit these to rebrand it for another business. */
window.SHC_CONFIG = {
  "offline": true,
  "installer": {
    "business": "Sunwise Solar Cleaning",
    "contact": "Will Richter",
    "phone": "0481 678 552",
    "email": "will@sunwisesolarcleaning.com",
    "licence": ""
  }
};
</script>
<script>
/* ---------- pure logic: dates, homeowner rating, technician maths ---------- */
const DAY = 86400000;
function parseDate(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); }
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoDate(new Date()); }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/DAY); }
function addMonths(s,n){ const d = parseDate(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return isoDate(d); }
function num(v){ if (v === null || v === undefined || v === '') return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',','.')); return Number.isFinite(n) ? n : null; }

/* --- homeowner --- */
const HOME_ITEMS = [
  {id:'dirt', q:'Dust, dirt or a grey film on the glass', help:'Compare the panels with a clean window. A dull, even haze counts.', level:'attention', clean:true,
    action:'A professional clean with purified water removes build-up that may be holding your system back.'},
  {id:'droppings', q:'Bird droppings or leaf litter on the panels', help:'Even small patches shade the cells underneath.', level:'attention', clean:true,
    action:'Droppings and leaves shade individual cells. Book a clean rather than hosing from the ground, which can leave mineral spots.'},
  {id:'lichen', q:'Lichen or moss (pale green or grey spots that do not wash off in rain)', help:'Usually starts along the bottom edge of each panel.', level:'attention', clean:true,
    action:'Lichen bonds to the glass and needs a specific treatment. Ask your installer about lichen removal.'},
  {id:'shade', q:'New shade on the panels between 9 am and 3 pm', help:'Tree growth, a new aerial, a neighbour’s extension.', level:'attention',
    action:'Shade on part of a string can pull down the whole string. Trimming the tree or asking your installer about options is worth it.'},
  {id:'birds', q:'Birds going under the panels, or nesting material in the gutter below', help:'Pigeons and mynas nest in the gap under the array.', level:'attention',
    action:'Nests hold moisture and droppings against cables. Ask about bird proofing.'},
  {id:'glass', q:'Cracked or shattered glass, or brown or burnt-looking marks on a panel', help:'Look for a spider-web crack pattern or a dark patch on one cell.', level:'urgent',
    action:'A damaged panel should be assessed by a licensed electrician. Do not touch it or hose it.'},
  {id:'cables', q:'Cables hanging loose, lying on the roof, or chewed', help:'Cables should be clipped up out of sight under the panels.', level:'urgent',
    action:'Loose or damaged DC cabling is a fire and shock risk. Keep clear and have a licensed electrician check it.'},
  {id:'loose', q:'A panel or rail that looks lifted, shifted or loose', help:'Check after storms and strong wind.', level:'urgent',
    action:'Have the mounting checked before the next strong wind. Stay off the roof.'},
  {id:'switchgear', q:'Cracks, water, rust or scorch marks on the inverter or its switches', help:'Look, do not open any covers.', level:'urgent',

/* Average output between two checks, from the inverter's lifetime total. */
function periodYield(check, prev, kw){

}
/* checks ascending by date -> same array with .yield attached */
function withYields(checks, kw){

  return sorted.map((c,i)=> Object.assign({}, c, {yield: i ? periodYield(c, sorted[i-1], kw) : null}));
}
function yearAgo(list, i){

function rateCheck(c, ctx){

  if (inv.status === 'off') reasons.push({level:'urgent', text:'Inverter is blank or off in daylight', action:'Check the solar supply main switch in your switchboard has not tripped. If it is on and the inverter is still blank, call your installer.'});
  if (inv.status === 'orange') reasons.push({level:'attention', text:'Inverter is showing an orange or flashing light' + (inv.code ? ' (' + inv.code + ')' : ''), action:'Often a warning rather than a fault. If it is still there tomorrow in full sun, send the code to your installer.'});
  if ((inv.status === 'green' || !inv.status) && inv.code) reasons.push({level:'attention', text:'Inverter message: ' + inv.code, action:'Send this code to your installer so they can tell you what it means.'});

    if ((c.items || {})[it.id] === 'yes') reasons.push({level:it.level, text:it.q, action:it.action, item:it.id, clean:!!it.clean, danger:!!it.danger});
  });
  const y = ctx.yield, ya = ctx.yearAgoYield;

    const drop = 1 - y.perDay / ya.perDay;
    if (drop > 0.2) reasons.push({level:'attention', text:'Average output is ' + Math.round(drop*100) + '% lower than the same time last year', action:'Weather varies year to year, but a drop this size is worth a clean and a check.'});
  }
  if (y && y.specific !== null && y.days >= 30 && y.specific < 1.5) reasons.push({level:'attention', text:'Average output is on the low side for the size of your system', action:'Shade, short winter days or an export limit can explain it. If none of those apply, ask your installer.'});

  const unanswered = HOME_ITEMS.filter(it=> !(c.items || {})[it.id]).length;
  const level = reasons.some(r=>r.level==='urgent') ? 'urgent' : reasons.some(r=>r.level==='attention') ? 'attention' : 'ok';

}

/* irradiance, optional cell-temperature correction and optional losses allowance */
function condFactor(cond){
  cond = cond || {};

  if (t !== null && gamma !== null) f *= 1 + (gamma/100) * (t - 25);

  return f;
}

  const vmpStr = n !== null && vmp !== null ? n * vmp : null;
  const vocStr = n !== null && voc !== null ? n * voc : null;
  const estimated = s.vmode === 'rated';
  const v = estimated ? vmpStr : num(s.v);
  const i = num(s.i);
  const watts = i !== null && v !== null ? i * v : null;
  const f = condFactor(rep.cond);
  const expected = ratedW !== null && f !== null ? ratedW * f : null;
  const pct = watts !== null && expected ? watts / expected * 100 : null;

}

  const done = rows.filter(r=> r.watts !== null && r.expected !== null);
  const incomplete = rows.length - done.length;

  const watts = rows.some(r=>r.watts !== null) ? sum('watts') : null;
  const ratedW = rows.some(r=>r.ratedW !== null) ? sum('ratedW') : null;
  const expected = complete ? done.reduce((a,r)=> a + r.expected, 0) : null;
  const pct = complete && expected ? done.reduce((a,r)=> a + r.watts, 0) / expected * 100 : null;
  return {rows, watts, ratedW, expected, pct, complete, incomplete, anyEstimated: rows.some(r=> r.estimated && r.watts !== null), factor: condFactor(rep.cond)};
}

const local = {
  mem:new Map(), idb:null,
  async open(){
    try{
      this.idb = await new Promise((res, rej)=>{
        const rq = indexedDB.open('solar-health-check', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('docs');
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error('blocked'));
      });
    }catch(e){ this.idb = null; }
  },
  tx(mode, fn){
    return new Promise((res, rej)=>{
      const t = this.idb.transaction('docs', mode); const st = t.objectStore('docs');
      const out = fn(st); t.oncomplete = () => res(out.result !== undefined ? out.result : out.value); t.onerror = () => rej(t.error);
    });
  },
  async list(prefix){
    if (!this.idb) return [...this.mem.entries()].filter(([k])=>k.startsWith(prefix + '/')).map(([,v])=>v);
    try{ return await this.tx('readonly', st => st.getAll(IDBKeyRange.bound(prefix + '/', prefix + '/￿'))); }catch(e){ return []; }
  },
  async get(key){
    if (!this.idb) return this.mem.get(key) || null;
    try{ return (await this.tx('readonly', st => st.get(key))) || null; }catch(e){ return null; }
  },
  async put(key, doc){
    if (!this.idb){ this.mem.set(key, doc); return; }
    try{ await this.tx('readwrite', st => st.put(doc, key)); }catch(e){ this.mem.set(key, doc); }
  },
  async del(key){
    this.mem.delete(key);
    if (this.idb) try{ await this.tx('readwrite', st => st.delete(key)); }catch(e){}
  }
};

/* ----- cloud storage: the viewer's private area, when their account allows it ----- */
const cloud = { db:null, base:null, ok:false, queue:Promise.resolve() };
const store = {
  where(){ return cloud.ok ? 'cloud' : 'local'; },
  async list(coll){
    const out = new Map();
    (await local.list(coll)).forEach(d => out.set(d.id, d));
    if (cloud.ok) try{ (await cloud.base.collection(coll).get()).docs.forEach(d => out.set(d.id, Object.assign({}, d.data(), {id:d.id}))); }catch(e){}
    return [...out.values()];
  },
  put(coll, doc){
    const body = JSON.parse(JSON.stringify(doc));
    cloud.queue = cloud.queue.then(async ()=>{
      if (cloud.ok){
        try{ await cloud.base.collection(coll).doc(doc.id).set(body); return; }
        catch(e){ if (e && e.code !== 'unavailable' && e.code !== 'resource_exhausted'){ cloud.ok = false; setBackendNote(); } }
      }
      await local.put(coll + '/' + doc.id, body);
    });
    return cloud.queue;
  },
  del(coll, id){
    cloud.queue = cloud.queue.then(async ()=>{
      await local.del(coll + '/' + id);
      if (cloud.ok) try{ await cloud.base.collection(coll).doc(id).delete(); }catch(e){}
    });

function shrinkPhoto(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      try{
        let max = 1280, q = 0.72, data = '';
        for (let k = 0; k < 6; k++){
          const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          data = cv.toDataURL('image/jpeg', q);
          if (data.length < 225000) break;     // keeps each photo inside the 256 KiB document limit
          if (q > 0.5) q -= 0.14; else max = Math.round(max * 0.78);
        }
        URL.revokeObjectURL(url); res(data);
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo this browser can read')); };
    img.src = url;
  });
}
async function addPhotos(parent, kind, files){

  if (failed) toast(failed + ' photo' + (failed > 1 ? 's' : '') + ' could not be read. Try a JPEG or PNG.');
  render();
}

    if (i === pts.length - 1) s += '<text class="val" x="' + cx + '" y="' + (top - 5) + '" text-anchor="middle">' + fmtN(c.yield.perDay, 1) + '</text>';
    s += '<rect class="hit" data-act="tip" data-i="' + i + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (ph + B) + '"><title>' + esc(fmtDate(c.date)) + '</title></rect>';
  });

    '<div class="meter ' + band + '"><i style="width:' + Math.max(0, Math.min(100, c.pct === null ? 0 : c.pct / 1.2)) + '%"></i></div><div class="ticks"><span>0</span><span>30</span><span>60</span><span>90</span><span>120%</span></div>' +
    '<p class="small"><span class="pill wrap ' + band + '">' + esc(pctWords(c.pct)) + '</span></p>' +

async function savePdf(){
  const r = S.rep; if (!r) return;
  try{
    if (!r.example) await loadPhotos(r.id);
    const bytes = await makePdf(r);
    const name = 'health-check-' + (String(r.customer || 'report').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'report') + '-' + r.date + '.pdf';
    const how = await deliverPdf(bytes, name);
    if (how === 'saved') toast('Report saved as PDF');
  }catch(e){
    if (e && e.code === 'declined') return;
    console.error(e);
    toast(e && e.code === 'rate_limited' ? 'A save prompt is already open. Answer it, then try again.' : 'The PDF could not be saved in this view.');
  }
}

  if (S.downloads){ await S.downloads.save({filename:name, data:blob}); return 'saved'; }
  // hosted outside Claude: phones get the share sheet (save to Files, email, message), computers get a download
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare){
    try{
      const file = new File([blob], name, {type:'application/pdf'});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return 'shared'; }
    }catch(e){ if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'saved';
}

/* ---------- render, events, boot ---------- */
function render(){
  $('#mode-home').setAttribute('aria-pressed', S.mode === 'home');
  $('#mode-tech').setAttribute('aria-pressed', S.mode === 'tech');
  const main = $('#view');
  if (S.loading){ main.innerHTML = '<div class="card"><p class="muted">Loading your saved checks…</p></div>'; return; }
  main.innerHTML = (views[S.view] || views['h-home'])();
  if (S.view === 'h-result' && S.system) loadPhotos(S.openId);
  if (S.view === 'h-check' && S.draft) loadPhotos(S.draft.id);
  if (S.view === 't-edit' && S.rep && !S.rep.example) loadPhotos(S.rep.id);
}
function go(view){ S.view = view; S.confirm = null; render(); window.scrollTo(0, 0); }
async function leaveReport(){ if (saveTimer) await saveRep(); }

const acts = {
  async mode(el){ await leaveReport(); S.mode = el.dataset.mode; try{ localStorage.setItem('shc-mode', S.mode); }catch(e){} go(S.mode === 'tech' ? 't-home' : 'h-home'); },
  async go(el){ await leaveReport(); if (el.dataset.view === 'h-setup') S.sysDraft = null; go(el.dataset.view); },
  set(el){
    const cur = getPath(el.dataset.path), val = el.dataset.val;
    setPath(el.dataset.path, String(cur) === val ? '' : val);
    render(); if (S.view === 't-edit') scheduleSave();
  },
  copy(el){ copyText(el.dataset.text, el.dataset.ok || 'Copied'); },
  tip(el){ S.tipIdx = +el.dataset.i; render(); },
  'start-check'(){
    if (!S.system){ S.sysDraft = null; S.afterSetup = true; toast('First, a few details about your system'); return go('h-setup'); }
    if (!S.draft){ S.draft = newCheck(); S.step = 0; }
    go('h-check');
  },
  step(el){ S.step = Math.max(0, Math.min(CHECK_STEPS.length - 1, S.step + (+el.dataset.d))); go('h-check'); },
  async 'finish-check'(){
    const c = S.draft; if (!c) return;
    if (!c.date) c.date = todayISO();
    S.checks.push(c); S.draft = null; S.openId = c.id; S.tipIdx = null;
    go('h-result');
    await store.put('checks', c);
  },
  async 'save-system'(){
    const d = S.sysDraft; d.id = 'system'; d.months = +d.months === 4 ? 4 : 3;
    S.system = d; S.sysDraft = null;
    await store.put('profile', d);
    toast('System saved');
    if (S.afterSetup){ S.afterSetup = false; S.draft = newCheck(); S.step = 0; return go('h-check'); }
    go('h-home');
  },
  'open-check'(el){ S.openId = el.dataset.id; go('h-result'); },
  'save-installer'(){ saveInstaller(); },
  'new-rep'(){ S.rep = newReport(); S.tab = 'details'; go('t-edit'); },
  'open-rep'(el){
    const r = el.dataset.id === 'example' ? demoReport() : S.reports.find(x => x.id === el.dataset.id);
    if (!r) return; S.rep = r; S.tab = 'summary'; go('t-edit');
  },
  async 'close-rep'(){ await leaveReport(); S.rep = null; go('t-home'); },
  async tab(el){ S.tab = el.dataset.tab; S.confirm = null; render(); },
  'add-string'(){ const r = S.rep; r.strings.push({id:uid(), name:'String ' + (r.strings.length + 1), n:r.strings[r.strings.length - 1].n || '', i:'', v:'', vmode:'measured'}); render(); scheduleSave(); },
  'del-string'(el){ S.rep.strings.splice(+el.dataset.i, 1); render(); scheduleSave(); },
  'mark-ok'(){ TECH_ITEMS.forEach(i => { if (!(S.rep.items[i.id] || {}).r) S.rep.items[i.id] = {r:'ok', note:''}; }); render(); scheduleSave(); },
  pdf(){ savePdf(); },
  'copy-rep'(){ copyText(reportText(S.rep), 'Summary copied'); },
  'photo-del'(el){ removePhoto(el.dataset.parent, el.dataset.id); },
  'confirm-ask'(el){ S.confirm = el.dataset.key; render(); },
  'confirm-no'(){ S.confirm = null; render(); },
  async 'confirm-yes'(el){
    const k = el.dataset.key; S.confirm = null;
    if (k === 'discard' && S.draft){
      const id = S.draft.id; S.draft = null; go('h-home');
      for (const p of (S.photos[id] || [])) await store.del('photos', p.id);
      delete S.photos[id];
    } else if (k === 'del-check'){
      const id = S.openId; S.checks = S.checks.filter(c => c.id !== id); go('h-home');
      await store.del('checks', id);
      for (const p of await store.photosFor(id)) await store.del('photos', p.id);
      toast('Check deleted');
    } else if (k === 'del-rep' && S.rep){
      const id = S.rep.id; clearTimeout(saveTimer); saveTimer = null;
      S.reports = S.reports.filter(r => r.id !== id); S.rep = null; go('t-home');
      await store.del('reports', id);
      for (const p of await store.photosFor(id)) await store.del('photos', p.id);
      toast('Report deleted');
    }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = acts[el.dataset.act]; if (fn) Promise.resolve(fn(el)).catch(err => { console.error(err); toast('Something went wrong. Your earlier entries are still saved.'); });
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  setPath(el.dataset.bind, el.value);
  if (S.view === 't-edit'){ refreshLive(); scheduleSave(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.photo && el.files && el.files.length){
    const files = [...el.files]; el.value = '';
    if (S.view === 't-edit' && S.rep && S.rep.isNew) saveRep();
    addPhotos(el.dataset.parent, el.dataset.photo, files);
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveRep(); });

async function start(prev){
  prev = prev || {};
  try{ const m = localStorage.getItem('shc-mode'); if (m === 'tech' || m === 'home') S.mode = m; }catch(e){}
  if (prev.mode) ['mode', 'view', 'draft', 'step', 'rep', 'tab', 'openId'].forEach(k => { if (prev[k] !== undefined) S[k] = prev[k]; });
  else S.view = S.mode === 'tech' ? 't-home' : 'h-home';
  setBackendNote();
  await local.open();
  if (CONFIG.installer) S.installer = Object.assign({}, CONFIG.installer);
  const li = await local.get('config/installer'); if (li) S.installer = li;
  await loadAll();
  // show local data straight away unless a viewer is about to hand over the account store
  const framed = FRAMED;
  let shown = false;
  const show = () => { if (!shown){ shown = true; S.loading = false; render(); } };
  if (!framed) show(); else setTimeout(show, 3500);
  if (framed){
    try{ await connectCloud(); if (cloud.ok) await loadAll(); }catch(e){}
    setBackendNote();
    const ae = document.activeElement; const busy = shown && ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    shown = true; S.loading = false;
    if (!busy) render();
  }
}
try{ if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({mode:S.mode, view:S.view, draft:S.draft, step:S.step, rep:S.rep, tab:S.tab, openId:S.openId})); }catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
if (CONFIG.offline && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
